    <linearGradient id="wi" gradientUnits="userSpaceOnUse" x1="24" y1="0" x2="104" y2="0"><stop offset="0" stop-color="#a98bff"/><stop offset=".5" stop-color="#e3d8ff"/><stop offset="1" stop-color="#a98bff"/></linearGradient>
    <radialGradient id="wg" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#c9b8ff" stop-opacity=".24"/><stop offset="1" stop-color="#c9b8ff" stop-opacity="0"/></radialGradient>
